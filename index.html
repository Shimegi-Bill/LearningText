<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3f4ee">
<link rel="apple-touch-icon" href="char-puzzle/apple-touch-icon.png">
<title>LearningText 學字遊戲</title>
<style>
:root{--ink:#22313f;--ink2:#4b5d6e;--frame:#5fb39c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#e3f4ee,#fff6e0);color:var(--ink);
  font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 24px) 16px 24px}
main{max-width:520px;margin:0 auto}
h1{font-size:28px;text-align:center;margin:0 0 6px}
p.sub{text-align:center;color:var(--ink2);margin:0 0 22px}
a.card{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--frame);border-radius:20px;padding:14px;
  text-decoration:none;color:var(--ink);box-shadow:0 5px 0 #bfe0d5}
a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #bfe0d5}
a.card img{width:72px;height:72px;border-radius:16px;flex:none}
a.card b{font-size:22px;display:block}
a.card span{font-size:15px;color:var(--ink2)}
footer{text-align:center;font-size:12px;color:#6b7c8a;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1>📚 學字遊戲</h1>
  <p class="sub">香港常用繁體字 · 俾小朋友玩</p>
  <a class="card" href="char-puzzle/">
    <img src="char-puzzle/icon-192.png" alt="">
    <div><b>拆字小偵探</b><span>揀筆畫，砌出新嘅字</span></div>
  </a>
  <footer>由 Bill Chiu 開發</footer>
</main>
</body>
</html>
